# TablePilot installer builds; no upstream release or updater publishing.
name: Build TablePilot installers
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Import verified TablePilot source (first run only)
        if: hashFiles('.tablepilot-bootstrap/import.py') != ''
        run: |
          python .tablepilot-bootstrap/import.py
          git config user.name "TablePilot Build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import TablePilot 0.3.0 source with AI and MCP removed"
          git push origin HEAD:main
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        # Use [linux-only] in a fix commit to avoid rebuilding a successful Windows package.
        os: ${{ contains(github.event.head_commit.message, '[linux-only]') && fromJSON('["ubuntu-24.04"]') || fromJSON('["windows-latest", "ubuntu-24.04"]') }}
    concurrency:
      group: tablepilot-${{ matrix.os }}-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf cmake
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-tablepilot.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: TablePilot-${{ runner.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 30
