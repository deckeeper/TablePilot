# TablePilot installer builds and releases to this repository only.
name: Build TablePilot installers
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    if: ${{ !contains(github.event.head_commit.message, '[automation-only]') }}
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        # Use [linux-only] in a fix commit to avoid rebuilding a successful Windows package.
        os: ${{ contains(github.event.head_commit.message, '[linux-only]') && fromJSON('["ubuntu-24.04"]') || fromJSON('["windows-latest", "ubuntu-24.04"]') }}
    concurrency:
      group: tablepilot-${{ matrix.os }}-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      CARGO_BUILD_JOBS: 2
      # Faster prototype installers; retain optimized release code and symbol stripping.
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.revision }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-workspace-crates: true
          shared-key: tablepilot-prototype-thin-v1
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf cmake
      - run: pnpm install --frozen-lockfile
      - name: Check frontend types
        run: pnpm exec vue-tsc --project apps/desktop/tsconfig.json
      - run: node scripts/build-tablepilot.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: TablePilot-${{ runner.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 30
