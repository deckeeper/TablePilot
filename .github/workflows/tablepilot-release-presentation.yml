name: Update TablePilot release descriptions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tablepilot-release-presentation.yml'
      - '.tablepilot/release-presentation.json'
      - 'scripts/tablepilot-release-presentation.py'
permissions:
  contents: write
concurrency:
  group: tablepilot-release-descriptions
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'deckeeper/TablePilot' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Update approved release descriptions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/tablepilot-release-presentation.py
